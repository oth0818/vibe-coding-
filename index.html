<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>공강 판정</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
  crossorigin="" onerror="window.leafletCssFailed = true">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
  integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g=="
  crossorigin=""></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  header { padding: 12px 16px 0; border-bottom: 1px solid #c8c8c8; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 8px 16px;
    border: 1px solid #c8c8c8;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: #f0f0f0;
    color: #1a1a1a;
    font: inherit;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: #ffffff;
    font-weight: 700;
    box-shadow: inset 0 3px 0 #1d4ed8;
  }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .empty { color: #444444; }
  [hidden] { display: none !important; }

  /* 시간표 */
  .tt-scroll { overflow-x: auto; border: 1px solid #c8c8c8; border-radius: 6px; }
  .tt { display: grid; grid-template-columns: 48px repeat(5, minmax(96px, 1fr)); min-width: 600px; }
  .tt-head { background: #f0f0f0; font-weight: 700; text-align: center; padding: 6px 0; border-bottom: 1px solid #c8c8c8; }
  .tt-times { position: relative; }
  .tt-time { position: absolute; left: 0; right: 4px; text-align: right; font-size: 12px; color: #444444; transform: translateY(-8px); }
  .tt-col { position: relative; border-left: 1px solid #c8c8c8; }
  .tt-line { position: absolute; left: 0; right: 0; border-top: 1px solid #e2e2e2; }
  .tt-block {
    position: absolute;
    left: 2px; right: 2px;
    padding: 2px 22px 2px 6px;
    overflow: hidden;
    background: #dbeafe;
    border: 1px solid #1d4ed8;
    border-radius: 4px;
    color: #0b1f4d;
    font-size: 12px;
    line-height: 1.3;
  }
  .tt-block b { display: block; font-size: 13px; }
  .tt-del {
    position: absolute; top: 1px; right: 1px;
    width: 20px; height: 20px; padding: 0;
    border: 1px solid #1d4ed8; border-radius: 4px;
    background: #ffffff; color: #0b1f4d;
    font: inherit; font-size: 14px; line-height: 1;
    cursor: pointer;
  }

  /* 추가 폼 */
  form { margin-top: 20px; padding: 12px; border: 1px solid #c8c8c8; border-radius: 6px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  label { display: block; font-size: 14px; font-weight: 600; }
  input, select {
    width: 100%; margin-top: 2px; padding: 6px 8px;
    border: 1px solid #767676; border-radius: 4px;
    background: #ffffff; color: #1a1a1a; font: inherit;
  }
  .time-label { display: block; font-size: 14px; font-weight: 600; }
  .time-selects { display: flex; align-items: center; gap: 4px; }
  .time-selects select { margin-top: 2px; }
  /* 공강 화면 */
  .days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .day-btn {
    padding: 6px 14px; border: 1px solid #767676; border-radius: 16px;
    background: #ffffff; color: #1a1a1a; font: inherit; cursor: pointer;
  }
  .day-btn[aria-pressed="true"] { background: #1d4ed8; border-color: #1d4ed8; color: #ffffff; font-weight: 700; }
  .cards { display: grid; gap: 8px; margin-bottom: 16px; }
  .card {
    display: block; width: 100%; text-align: left;
    padding: 10px 12px; border: 1px solid #767676; border-radius: 6px;
    background: #ffffff; color: #1a1a1a; font: inherit; cursor: pointer;
  }
  .card[aria-pressed="true"] { border: 2px solid #1d4ed8; background: #eff4ff; padding: 9px 11px; }
  .card .when { font-weight: 700; }
  .card .sub { font-size: 14px; color: #333333; }
  .card .now { font-size: 14px; font-weight: 700; color: #0a5c2e; }
  .elev { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
  .elev-label { font-weight: 600; }
  .stay-field { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .stay-field label { font-weight: 600; }
  .stay-field input { width: 90px; margin-top: 0; }
  .stay-msg { color: #b00020; font-weight: 600; font-size: 14px; }
  .map { height: 380px; border: 1px solid #767676; border-radius: 6px; }
  .legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; font-size: 14px; }
  .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #1a1a1a; border-radius: 50%; vertical-align: -1px; }
  .sw-ok { background: #1b8a3a; }
  .sw-maybe { background: #f2b705; }
  .sw-short { background: #8a8a8a; }
  #gg-map-wrap { margin-bottom: 12px; }
  #gg-picked { margin-bottom: 16px; }
  #gg-picked h3 { margin: 0 0 6px; font-size: 16px; }
  .summary { margin: 0 0 4px; font-weight: 600; }
  .note { margin: 0 0 12px; font-size: 14px; color: #444444; }
  .place-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .place-row { padding: 10px 12px; border: 1px solid #c8c8c8; border-radius: 6px; }
  .place-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .place-name { font-weight: 700; }
  .badge { padding: 1px 8px; border-radius: 10px; font-size: 14px; font-weight: 700; border: 1px solid; }
  .badge.ok { color: #0a5c2e; background: #e6f4ea; border-color: #0a5c2e; }
  .badge.short { color: #b00020; background: #fdeaea; border-color: #b00020; }
  .badge.maybe { color: #6b4100; background: #fff4d6; border-color: #6b4100; }
  .place-detail { margin: 4px 0 0; font-size: 14px; color: #333333; }
  .submit {
    margin-top: 12px; padding: 8px 20px;
    border: none; border-radius: 4px;
    background: #1d4ed8; color: #ffffff;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .msg { margin: 10px 0 0; min-height: 1.5em; font-weight: 600; }
  .msg.error { color: #b00020; }
  .storage-warn { margin: 0 0 12px; padding: 8px 12px; border: 1px solid #b00020; border-radius: 4px; color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>공강 판정</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-gonggang" data-screen="gonggang" aria-selected="true">공강</button>
    <button class="tab" role="tab" id="tab-places" data-screen="places" aria-selected="false">저장한 곳</button>
    <button class="tab" role="tab" id="tab-timetable" data-screen="timetable" aria-selected="false">시간표</button>
  </div>
</header>

<main>
  <section id="screen-gonggang" role="tabpanel" aria-labelledby="tab-gonggang">
    <h2>공강</h2>
    <p id="gg-warn" class="storage-warn" hidden></p>
    <div id="gg-days" class="days" role="group" aria-label="요일 선택"></div>
    <div id="gg-cards" class="cards"></div>
    <div id="gg-elev" class="elev" role="group" aria-label="엘리베이터 혼잡도"></div>
    <div id="gg-stay" class="stay-field" hidden>
      <label for="gg-stay-input">머물 시간 (분)</label>
      <input id="gg-stay-input" type="number" min="1" max="180" step="1" value="25" inputmode="numeric">
      <span id="gg-stay-msg" class="stay-msg" role="status"></span>
    </div>
    <div id="gg-map-wrap" hidden>
      <div id="gg-map" class="map"></div>
      <ul id="gg-legend" class="legend">
        <li><span class="sw sw-ok"></span> 가능</li>
        <li><span class="sw sw-maybe"></span> 시간은 되지만 문 닫았을 수 있음</li>
        <li><span class="sw sw-short"></span> 부족</li>
      </ul>
      <p id="gg-map-note" class="note"></p>
    </div>
    <div id="gg-picked" hidden></div>
    <div id="gg-result"></div>
  </section>

  <section id="screen-places" role="tabpanel" aria-labelledby="tab-places" hidden>
    <h2>저장한 곳</h2>
    <p class="empty">아직 비어 있음</p>
  </section>

  <section id="screen-timetable" role="tabpanel" aria-labelledby="tab-timetable" hidden>
    <h2>시간표</h2>
    <p id="storage-warn" class="storage-warn" hidden></p>
    <div class="tt-scroll"><div id="tt" class="tt"></div></div>

    <form id="add-form" novalidate>
      <div class="fields">
        <label>요일
          <select id="f-day">
            <option>월</option><option>화</option><option>수</option><option>목</option><option>금</option>
          </select>
        </label>
        <label>과목
          <input id="f-name" type="text" autocomplete="off">
        </label>
        <label>건물
          <select id="f-building"></select>
        </label>
        <label>호실 (3자리)
          <input id="f-room" type="text" inputmode="numeric" maxlength="3" autocomplete="off">
        </label>
        <div class="time-field" role="group" aria-labelledby="lbl-start">
          <span class="time-label" id="lbl-start">시작</span>
          <div class="time-selects">
            <select id="f-start-h" aria-label="시작 시"></select>
            <span aria-hidden="true">:</span>
            <select id="f-start-m" aria-label="시작 분"></select>
          </div>
        </div>
        <div class="time-field" role="group" aria-labelledby="lbl-end">
          <span class="time-label" id="lbl-end">끝</span>
          <div class="time-selects">
            <select id="f-end-h" aria-label="끝 시"></select>
            <span aria-hidden="true">:</span>
            <select id="f-end-m" aria-label="끝 분"></select>
          </div>
        </div>
      </div>
      <button class="submit" type="submit">수업 추가</button>
      <p id="form-msg" class="msg" role="status"></p>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";

  var DAYS = ["월", "화", "수", "목", "금"];
  var BUILDINGS = ["원형관", "중앙문화관"];
  var STORAGE_KEY = "timetable";
  var DEFAULT_START = 9 * 60;   // 표 기본 범위 09:00
  var DEFAULT_END = 18 * 60;    // ~ 18:00
  var PX_PER_MIN = 1;

  var DEFAULT_TIMETABLE = [
    { id: "d1", day: "월", name: "이머시브 AI 기술",             building: "원형관",   room: "707", start: "10:30", end: "13:30" },
    { id: "d2", day: "월", name: "피지컬컴퓨팅과제어",           building: "원형관",   room: "706", start: "14:30", end: "17:30" },
    { id: "d3", day: "화", name: "인터랙티브 지능형 시스템 설계", building: "원형관",   room: "108", start: "10:30", end: "13:30" },
    { id: "d4", day: "화", name: "산업체 핸즈온 프로젝트",       building: "원형관",   room: "519", start: "14:30", end: "17:30" },
    { id: "d5", day: "수", name: "인공지능과머신러닝",           building: "원형관",   room: "614", start: "13:30", end: "17:30" },
    { id: "d6", day: "목", name: "AI 스토리텔링",                building: "중앙문화관", room: "301", start: "10:30", end: "13:30" },
    { id: "d7", day: "금", name: "캡스톤 디자인 프로젝트 I",     building: "원형관",   room: "108", start: "09:30", end: "13:30" }
  ];

  /* CALC-START */
  // ---------- 시간·층 계산 ----------
  function toMin(hhmm) {
    var p = hhmm.split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(min) { return pad(Math.floor(min / 60)) + ":" + pad(min % 60); }
  function floorOf(room) { return parseInt(room.charAt(0), 10); }

  // ---------- 판정 계산 (CLAUDE.md 계산 규칙) ----------
  var WALK_M_PER_MIN = 75;
  var DETOUR = 1.3;        // 길 찾기 없이 직선거리 × 1.3
  var ENTRY_MIN = 1;       // 건물 출입
  var MARGIN_MIN = 2;      // 여유
  var STAIRS_MIN = 1;      // 2층
  var ELEVATOR_BUSY_MIN = 5;    // 3층 이상, 붐빔
  var ELEVATOR_QUIET_MIN = 1;   // 3층 이상, 한산
  var GAP_MIN = 20;        // 이 이상 비면 공강
  var BUILDING_COORDS = {
    "원형관":   { lat: 37.0013193, lng: 127.2287837 },
    "중앙문화관": { lat: 37.0038675, lng: 127.2292335 }
  };

  function distanceM(lat1, lng1, lat2, lng2) {
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function floorMoveMin(floor, elevatorMin) {
    if (floor <= 1) return 0;
    if (floor === 2) return STAIRS_MIN;
    return elevatorMin;
  }

  var ROUTE_ANOMALY_FACTOR = 2;   // 길 찾기 거리가 직선거리의 이 배수를 넘으면 지도 데이터 이상으로 봄

  // 도보 한 구간(건물 ↔ 장소). 우선순위: 직접 잰 값 → 길 찾기 → 직선 × 1.3
  // routeOf(building, place): { state: "ok", m } | { state: "pending" } | { state: "failed" } | undefined
  // 반환: { min, src: "direct" | "route" | "anomaly" | "straight", straightM, routeM, state }
  function walkLeg(place, building, routeOf) {
    if (place.walk !== null && place.walk !== undefined) return { min: place.walk, src: "direct" };
    var b = BUILDING_COORDS[building];
    var straightM = distanceM(b.lat, b.lng, place.lat, place.lng);
    var straightMin = Math.ceil(straightM * DETOUR / WALK_M_PER_MIN) + ENTRY_MIN;
    var rt = routeOf ? routeOf(building, place) : undefined;
    if (rt && rt.state === "ok") {
      if (rt.m > ROUTE_ANOMALY_FACTOR * straightM) {
        return { min: straightMin, src: "anomaly", straightM: straightM, routeM: rt.m };
      }
      return { min: Math.ceil(rt.m / WALK_M_PER_MIN) + ENTRY_MIN, src: "route", straightM: straightM, routeM: rt.m };
    }
    return { min: straightMin, src: "straight", straightM: straightM, state: rt ? rt.state : undefined };
  }

  // 같은 요일 연속 수업 사이 간격이 GAP_MIN 이상이면 공강
  function findGaps(classes, day) {
    var list = classes.filter(function (c) { return c.day === day; })
      .sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
    var gaps = [];
    for (var i = 1; i < list.length; i++) {
      var s = toMin(list[i - 1].end), e = toMin(list[i].start);
      if (e - s >= GAP_MIN) gaps.push({ prev: list[i - 1], next: list[i], start: s, end: e });
    }
    return gaps;
  }

  function maybeClosed(place, arrival) {
    var leave = arrival + place.stay;
    if (place.open !== null && place.close !== null) {
      if (arrival < toMin(place.open) || leave > toMin(place.close)) return true;
    }
    if (place.breakStart !== null && place.breakEnd !== null) {
      if (arrival < toMin(place.breakEnd) && leave > toMin(place.breakStart)) return true;
    }
    return false;
  }

  // gap: findGaps 결과 하나, startMin: 계산 시작 시각(분), place: 저장한 곳
  // routeOf: 길 찾기 결과 조회 함수(없으면 모두 직선 추정)
  function judge(gap, startMin, place, elevatorMin, routeOf) {
    var remaining = gap.end - startMin;
    var goLeg = walkLeg(place, gap.prev.building, routeOf);
    var backLeg = walkLeg(place, gap.next.building, routeOf);
    var go = floorMoveMin(floorOf(gap.prev.room), elevatorMin) + goLeg.min;
    var back = backLeg.min + floorMoveMin(floorOf(gap.next.room), elevatorMin);
    var stay = remaining - go - back - MARGIN_MIN;
    var ok = stay >= place.stay;
    var arrival = startMin + go;
    return {
      remaining: remaining, go: go, back: back, goLeg: goLeg, backLeg: backLeg, stay: stay, ok: ok,
      shortage: ok ? 0 : place.stay - stay,
      leaveAt: gap.end - back - MARGIN_MIN,
      arrival: arrival,
      maybeClosed: maybeClosed(place, arrival)
    };
  }

  // 갈 수 있는 범위 원 반지름(m). 0 이하면 갈 수 있는 범위 없음
  function rangeRadiusM(gap, startMin, stayMin, elevatorMin) {
    var remaining = gap.end - startMin;
    var floors = floorMoveMin(floorOf(gap.prev.room), elevatorMin) +
                 floorMoveMin(floorOf(gap.next.room), elevatorMin);
    var spare = remaining - floors - stayMin - MARGIN_MIN - 2 * ENTRY_MIN;
    return (spare / 2) * WALK_M_PER_MIN / DETOUR;
  }
  /* CALC-END */

  /* ROUTE-START */
  // ---------- 길 찾기 (routing.openstreetmap.de 도보, 키 없음) ----------
  var ROUTE_BASE = "https://routing.openstreetmap.de/routed-foot/route/v1/foot/";
  var ROUTE_TIMEOUT_MS = 8000;
  var ROUTE_CACHE_MAX = 200;
  var ROUTE_CACHE_KEY = "routes";

  var routeCache = {};       // key -> { m, line: [[lat, lng], ...], t }
  var routeStatus = {};      // key -> "pending" | "failed" (이 페이지를 여는 동안만)
  var routeQueue = [];       // [{ key, from, to }]
  var routeBusy = false;
  var routeSeq = 0;
  var routeListener = null;  // 결과가 바뀔 때마다 부르는 함수

  function routeKey(from, to) {
    return from.lat.toFixed(5) + "," + from.lng.toFixed(5) + ">" + to.lat.toFixed(5) + "," + to.lng.toFixed(5);
  }

  // OSRM 응답 -> { m, line } 또는 null(이상한 응답)
  function parseRoute(json) {
    if (!json || json.code !== "Ok" || !Array.isArray(json.routes) || json.routes.length === 0) return null;
    var r = json.routes[0];
    if (!r || typeof r.distance !== "number" || !isFinite(r.distance) || r.distance < 0) return null;
    var co = r.geometry && r.geometry.coordinates;
    if (!Array.isArray(co) || co.length < 1) return null;
    var line = [];
    for (var i = 0; i < co.length; i++) {
      var c = co[i];
      if (!Array.isArray(c) || typeof c[0] !== "number" || typeof c[1] !== "number" ||
          !isFinite(c[0]) || !isFinite(c[1])) return null;
      line.push([c[1], c[0]]);
    }
    return { m: r.distance, line: line };
  }

  function isValidRouteEntry(e) {
    return e && typeof e.m === "number" && isFinite(e.m) && e.m >= 0 &&
      typeof e.t === "number" && Array.isArray(e.line) &&
      e.line.every(function (pt) { return Array.isArray(pt) && pt.length === 2 && isFinite(pt[0]) && isFinite(pt[1]); });
  }

  function loadRouteCache() {
    try {
      var raw = localStorage.getItem(ROUTE_CACHE_KEY);
      if (raw === null) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== "object" || Array.isArray(data)) return;
      Object.keys(data).forEach(function (k) {
        if (isValidRouteEntry(data[k])) {
          routeCache[k] = data[k];
          if (data[k].t > routeSeq) routeSeq = data[k].t;
        }
      });
    } catch (e) { /* 깨진 값은 무시하고 빈 캐시로 시작 */ }
  }

  function saveRouteCache() {
    var keys = Object.keys(routeCache);
    if (keys.length > ROUTE_CACHE_MAX) {
      keys.sort(function (a, b) { return routeCache[a].t - routeCache[b].t; });
      keys.slice(0, keys.length - ROUTE_CACHE_MAX).forEach(function (k) { delete routeCache[k]; });
    }
    try { localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(routeCache)); } catch (e) { /* 메모리 캐시만 씀 */ }
  }

  // 조회: { state: "ok", m, line } | { state: "pending" | "failed" } | undefined(요청한 적 없음)
  function routeOf(building, place) {
    var key = routeKey(BUILDING_COORDS[building], place);
    var c = routeCache[key];
    if (c) return { state: "ok", m: c.m, line: c.line };
    if (routeStatus[key]) return { state: routeStatus[key] };
    return undefined;
  }

  // 건물 -> 장소 한 방향만 요청. 돌아오는 길에도 같은 거리를 씀. urgent면 대기열 맨 앞
  function requestRoute(building, place, urgent) {
    var from = BUILDING_COORDS[building];
    var key = routeKey(from, place);
    if (routeCache[key] || routeStatus[key] === "failed") return;
    if (routeStatus[key] === "pending") {
      if (urgent) {
        for (var i = 0; i < routeQueue.length; i++) {
          if (routeQueue[i].key === key) { routeQueue.unshift(routeQueue.splice(i, 1)[0]); break; }
        }
      }
      return;
    }
    routeStatus[key] = "pending";
    var task = { key: key, from: from, to: { lat: place.lat, lng: place.lng } };
    if (urgent) routeQueue.unshift(task); else routeQueue.push(task);
    routePump();
  }

  // 한 번에 하나씩 순서대로
  function routePump() {
    if (routeBusy || routeQueue.length === 0) return;
    routeBusy = true;
    var task = routeQueue.shift();
    var finished = false;
    var timer = null;
    function finish(parsed) {
      if (finished) return;
      finished = true;
      if (timer) clearTimeout(timer);
      if (parsed) {
        routeCache[task.key] = { m: parsed.m, line: parsed.line, t: ++routeSeq };
        delete routeStatus[task.key];
        saveRouteCache();
      } else {
        routeStatus[task.key] = "failed";
      }
      routeBusy = false;
      if (routeListener) routeListener();
      routePump();
    }
    try {
      var url = ROUTE_BASE +
        task.from.lng.toFixed(6) + "," + task.from.lat.toFixed(6) + ";" +
        task.to.lng.toFixed(6) + "," + task.to.lat.toFixed(6) +
        "?overview=full&geometries=geojson";
      var ctrl = new AbortController();
      timer = setTimeout(function () { ctrl.abort(); }, ROUTE_TIMEOUT_MS);
      fetch(url, { signal: ctrl.signal })
        .then(function (res) { if (!res.ok) throw new Error("http " + res.status); return res.json(); })
        .then(function (json) { finish(parseRoute(json)); })
        .catch(function () { finish(null); });
    } catch (e) {
      finish(null);
    }
  }

  // pairs: [{ building, place }]. 같은 쌍은 한 번만 셈
  function routeProgress(pairs) {
    var seen = {}, total = 0, done = 0, failed = 0;
    pairs.forEach(function (pr) {
      var key = routeKey(BUILDING_COORDS[pr.building], pr.place);
      if (seen[key]) return;
      seen[key] = true;
      total++;
      if (routeCache[key]) done++;
      else if (routeStatus[key] === "failed") { done++; failed++; }
    });
    return { total: total, done: done, failed: failed };
  }

  loadRouteCache();
  /* ROUTE-END */

  function isValidClass(c) {
    return c && typeof c === "object" &&
      typeof c.id === "string" &&
      DAYS.indexOf(c.day) !== -1 &&
      typeof c.name === "string" && c.name !== "" &&
      BUILDINGS.indexOf(c.building) !== -1 &&
      typeof c.room === "string" && /^[1-9]\d\d$/.test(c.room) &&
      typeof c.start === "string" && /^\d\d:\d\d$/.test(c.start) &&
      typeof c.end === "string" && /^\d\d:\d\d$/.test(c.end) &&
      toMin(c.end) > toMin(c.start);
  }

  // ---------- 저장 ----------
  var storageWarning = "";

  function copyDefault() {
    return DEFAULT_TIMETABLE.map(function (c) { return Object.assign({}, c); });
  }

  function load() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      storageWarning = "이 브라우저에서는 저장소를 쓸 수 없어 기본 시간표로 동작합니다. 변경 내용은 저장되지 않습니다.";
      return copyDefault();
    }
    if (raw === null) return copyDefault();
    try {
      var data = JSON.parse(raw);
      if (Array.isArray(data) && data.every(isValidClass)) return data;
    } catch (e) { /* 아래에서 기본값 */ }
    storageWarning = "저장된 시간표가 깨져 있어 기본 시간표로 되돌렸습니다.";
    return copyDefault();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timetable));
      return true;
    } catch (e) {
      storageWarning = "저장에 실패했습니다. 새로고침하면 변경 내용이 사라질 수 있습니다.";
      return false;
    }
  }

  var timetable = load();

  // ---------- 탭 ----------
  var tabs = document.querySelectorAll(".tab");
  function showScreen(name) {
    Array.prototype.forEach.call(tabs, function (t) {
      var on = t.getAttribute("data-screen") === name;
      t.setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById("screen-" + t.getAttribute("data-screen")).hidden = !on;
    });
    if (name === "gonggang") renderGonggang();   // 지금 모드가 현재 시각을 따르도록
  }
  Array.prototype.forEach.call(tabs, function (t) {
    t.addEventListener("click", function () { showScreen(t.getAttribute("data-screen")); });
  });

  // ---------- 주간 표 ----------
  var ttEl = document.getElementById("tt");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderWarning() {
    var w = document.getElementById("storage-warn");
    w.textContent = storageWarning;
    w.hidden = storageWarning === "";
  }

  function renderTable() {
    // 표 범위: 기본 09:00~18:00, 수업이 벗어나면 정시 단위로 늘림
    var lo = DEFAULT_START, hi = DEFAULT_END;
    timetable.forEach(function (c) {
      lo = Math.min(lo, Math.floor(toMin(c.start) / 60) * 60);
      hi = Math.max(hi, Math.ceil(toMin(c.end) / 60) * 60);
    });
    var height = (hi - lo) * PX_PER_MIN;

    ttEl.textContent = "";

    ttEl.appendChild(el("div", "tt-head", ""));
    DAYS.forEach(function (d) { ttEl.appendChild(el("div", "tt-head", d)); });

    var times = el("div", "tt-times");
    times.style.height = height + "px";
    for (var m = lo; m <= hi; m += 60) {
      var t = el("div", "tt-time", fmt(m));
      t.style.top = ((m - lo) * PX_PER_MIN) + "px";
      times.appendChild(t);
    }
    ttEl.appendChild(times);

    DAYS.forEach(function (d) {
      var col = el("div", "tt-col");
      col.style.height = height + "px";
      for (var m2 = lo; m2 < hi; m2 += 60) {
        var line = el("div", "tt-line");
        line.style.top = ((m2 - lo) * PX_PER_MIN) + "px";
        col.appendChild(line);
      }
      timetable.filter(function (c) { return c.day === d; }).forEach(function (c) {
        var s = toMin(c.start), e = toMin(c.end);
        var b = el("div", "tt-block");
        b.style.top = ((s - lo) * PX_PER_MIN) + "px";
        b.style.height = ((e - s) * PX_PER_MIN - 1) + "px";
        b.appendChild(el("b", "", c.name));
        b.appendChild(el("span", "", c.building + " " + c.room + "호 (" + floorOf(c.room) + "층)"));
        b.appendChild(document.createElement("br"));
        b.appendChild(el("span", "", c.start + "–" + c.end));
        var del = el("button", "tt-del", "×");
        del.type = "button";
        del.setAttribute("aria-label", c.name + " 삭제");
        del.addEventListener("click", function () {
          if (confirm("\"" + c.name + "\" 수업을 지울까요?")) removeClass(c.id);
        });
        b.appendChild(del);
        col.appendChild(b);
      });
      ttEl.appendChild(col);
    });

    renderWarning();
    renderGonggang();
  }

  // ---------- 저장한 곳 (이번 기능에서는 읽기만) ----------
  var PLACES_KEY = "places";
  var placesWarning = "";

  function place(id, name, lat, lng, stay, open, close) {
    return { id: id, name: name, lat: lat, lng: lng, stay: stay,
             open: open, close: close, breakStart: null, breakEnd: null, walk: null };
  }
  var DEFAULT_PLACES = [
    place("p1", "학생식당 (건강증진관)",     37.0054616, 127.227504,  25, null, null),
    place("p2", "까로치아 (원형관 1층 카페)", 37.0013193, 127.2287837, 10, null, null),
    place("p3", "부리또앤",                  37.0022322, 127.2267668, 20, null, null),
    place("p4", "하얀집",                    37.0023405, 127.22663,   25, "09:00", "21:00"),
    place("p5", "소녀식당",                  37.0034352, 127.2249572, 25, "12:00", "20:00"),
    place("p6", "중앙도서관",                37.0031358, 127.2312322, 30, null, null),
    place("p7", "한경대 안성캠퍼스",         37.0116265, 127.2642483, 25, null, null)
  ];

  function isHHMM(s) { return typeof s === "string" && /^\d\d:\d\d$/.test(s); }
  function isPair(a, b) {
    return (a === null && b === null) || (isHHMM(a) && isHHMM(b));
  }
  function isValidPlace(p) {
    return p && typeof p === "object" &&
      typeof p.id === "string" &&
      typeof p.name === "string" && p.name !== "" &&
      typeof p.lat === "number" && isFinite(p.lat) &&
      typeof p.lng === "number" && isFinite(p.lng) &&
      typeof p.stay === "number" && p.stay > 0 &&
      isPair(p.open, p.close) && isPair(p.breakStart, p.breakEnd) &&
      (p.walk === null || (typeof p.walk === "number" && p.walk >= 0));
  }
  function copyDefaultPlaces() {
    return DEFAULT_PLACES.map(function (p) { return Object.assign({}, p); });
  }
  function loadPlaces() {
    var raw = null;
    try {
      raw = localStorage.getItem(PLACES_KEY);
    } catch (e) {
      placesWarning = "이 브라우저에서는 저장소를 쓸 수 없어 기본 장소 목록으로 동작합니다.";
      return copyDefaultPlaces();
    }
    if (raw === null) {
      var seed = copyDefaultPlaces();
      try { localStorage.setItem(PLACES_KEY, JSON.stringify(seed)); } catch (e) { /* 기본값으로 계속 */ }
      return seed;
    }
    try {
      var data = JSON.parse(raw);
      if (Array.isArray(data) && data.every(isValidPlace)) return data;
    } catch (e) { /* 아래에서 기본값 */ }
    placesWarning = "저장된 장소 목록이 깨져 있어 기본 장소 목록으로 동작합니다.";
    return copyDefaultPlaces();
  }
  var places = loadPlaces();

  // ---------- 공강 화면 ----------
  function todayIndex() {
    var d = new Date().getDay();            // 0 일 ~ 6 토
    return d >= 1 && d <= 5 ? d - 1 : -1;
  }
  function nowMinutes() {
    var n = new Date();
    return n.getHours() * 60 + n.getMinutes() + (n.getSeconds() > 0 ? 1 : 0);
  }
  var ggDay = todayIndex() >= 0 ? DAYS[todayIndex()] : DAYS[0];
  var ggGap = 0;
  var ggQuiet = false;   // 엘리베이터 한산 여부. 기본값은 붐빔
  var ggStay = 25;       // 머물 시간 입력값(분). 범위 원과 지도에서 고른 곳 판정에 씀
  var ggCtx = null;      // 지금 선택된 공강의 계산 기준 { g, startMin, elevatorMin }. 공강이 없으면 null
  var ggPicked = null;   // { type: "saved", id } 또는 { type: "custom", lat, lng }

  var STAY_MIN = 1, STAY_MAX = 180;
  var DOT_COLORS = { ok: "#1b8a3a", maybe: "#f2b705", short: "#8a8a8a" };

  function statusOf(r) {
    if (!r.ok) return { cls: "short", text: r.shortage + "분 부족" };
    if (r.maybeClosed) return { cls: "maybe", text: "시간은 되지만 문 닫았을 수 있음" };
    return { cls: "ok", text: "가능" };
  }

  function fmtM(m) { return String(Math.round(m)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  // 도보 거리를 어디서 가져왔는지 보여주는 라벨
  function legLabel(leg) {
    if (leg.src === "direct") return "직접 잰 값";
    if (leg.src === "route") return "길 따라 " + fmtM(leg.routeM) + "m (직선 추정이면 약 " + fmtM(leg.straightM) + "m)";
    if (leg.src === "anomaly") return "직선 추정 (길 데이터 이상: 길 찾기 " + fmtM(leg.routeM) + "m)";
    return "직선 추정" + (leg.state === "pending" ? " (길 찾는 중)" : leg.state === "failed" ? " (길 찾기 실패)" : "");
  }
  function walkLabel(r) {
    var a = legLabel(r.goLeg), b = legLabel(r.backLeg);
    return a === b ? a : "가는 길 " + a + " · 오는 길 " + b;
  }

  // 판정 한 줄(목록과 고른 곳 판정에서 같이 씀). extra: 덧붙일 설명 한 줄(선택)
  function buildRow(p, r, extra) {
    var li = el("li", "place-row");
    var top = el("div", "place-top");
    top.appendChild(el("span", "place-name", p.name));
    var st = statusOf(r);
    top.appendChild(el("span", "badge " + st.cls, st.text));
    li.appendChild(top);

    li.appendChild(el("p", "place-detail", r.ok
      ? "머물 수 있는 시간 " + r.stay + "분 · 늦어도 " + fmt(r.leaveAt) + "에 출발"
      : "늦어도 출발 시각 —"));
    li.appendChild(el("p", "place-detail",
      "가는 시간 " + r.go + "분 · 돌아오는 시간 " + r.back + "분 · 필요한 머물 시간 " + p.stay + "분"));
    li.appendChild(el("p", "place-detail", "도보: " + walkLabel(r)));
    if (p.open !== null) {
      li.appendChild(el("p", "place-detail",
        "영업 " + p.open + "–" + p.close + " · 도착 예정 " + fmt(r.arrival)));
    }
    if (extra) li.appendChild(el("p", "place-detail", extra));
    return li;
  }

  // ---------- 지도 (Leaflet을 못 불러오면 지도만 빠지고 판정은 계속 동작) ----------
  var map = null, overlay = null, mapBroken = false;

  function ensureMap() {
    if (mapBroken) return false;
    if (map) return true;
    if (typeof L === "undefined" || window.leafletCssFailed) { mapBroken = true; return false; }
    try {
      var c = BUILDING_COORDS["원형관"];
      map = L.map("gg-map").setView([c.lat, c.lng], 15);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
      }).addTo(map);
      overlay = L.layerGroup().addTo(map);
      map.on("click", function (e) {
        if (!ggCtx) return;
        ggPicked = { type: "custom", lat: e.latlng.lat, lng: e.latlng.lng };
        refreshPicked();
      });
      return true;
    } catch (e) {
      map = null; overlay = null; mapBroken = true;
      return false;
    }
  }

  function pickedPlace() {
    if (!ggPicked) return null;
    if (ggPicked.type === "saved") {
      for (var i = 0; i < places.length; i++) if (places[i].id === ggPicked.id) return places[i];
      return null;
    }
    return { id: "custom", name: "지도에서 고른 곳", lat: ggPicked.lat, lng: ggPicked.lng,
             stay: ggStay, open: null, close: null, breakStart: null, breakEnd: null, walk: null };
  }

  function drawOverlay() {
    overlay.clearLayers();
    var note = document.getElementById("gg-map-note");
    if (!ggCtx) return;
    var g = ggCtx.g;

    var center = BUILDING_COORDS[g.prev.building];
    var radius = rangeRadiusM(g, ggCtx.startMin, ggStay, ggCtx.elevatorMin);
    if (radius > 0) {
      L.circle([center.lat, center.lng], {
        radius: radius, color: "#1d4ed8", weight: 2,
        fillColor: "#1d4ed8", fillOpacity: 0.08, interactive: false
      }).addTo(overlay);
      note.textContent = "파란 원: 직선 기준 대략적인 갈 수 있는 범위입니다. 중심은 앞 수업 건물(" +
        g.prev.building + "), 반지름 약 " + Math.round(radius) + "m (머물 시간 " + ggStay + "분 기준)";
    } else {
      note.textContent = "이 공강에서는 머물 시간 " + ggStay + "분을 채우며 갈 수 있는 범위가 없습니다 (직선 기준 대략적인 추정).";
    }

    // 고른 곳까지 길 찾기 결과가 있으면 그 길을 선으로 그림 (길 데이터 이상·대기·실패면 그리지 않음)
    var pp = pickedPlace();
    if (pp) {
      var rp = judge(g, ggCtx.startMin, pp, ggCtx.elevatorMin, routeOf);
      var legs = [{ b: g.prev.building, leg: rp.goLeg, color: "#c2410c", dash: null }];
      if (g.next.building !== g.prev.building) {
        legs.push({ b: g.next.building, leg: rp.backLeg, color: "#6d28d9", dash: "6 6" });
      }
      legs.forEach(function (x) {
        if (x.leg.src !== "route") return;
        var entry = routeOf(x.b, pp);
        if (!entry || entry.state !== "ok") return;
        var opts = { color: x.color, weight: 4, opacity: 0.9, interactive: false };
        if (x.dash) opts.dashArray = x.dash;
        L.polyline(entry.line, opts).addTo(overlay);
      });
    }

    function dot(p, isPicked, isCustom) {
      var r = judge(ggCtx.g, ggCtx.startMin, p, ggCtx.elevatorMin, routeOf);
      var st = statusOf(r);
      var m = L.circleMarker([p.lat, p.lng], {
        radius: isCustom ? 10 : 8,
        color: "#1a1a1a", weight: isPicked ? 4 : 1.5,
        fillColor: DOT_COLORS[st.cls], fillOpacity: 0.95,
        bubblingMouseEvents: false
      }).addTo(overlay);
      m.bindTooltip(p.name + " · " + (st.cls === "maybe" ? "⚠ " : "") + st.text);
      return m;
    }
    var sel = ggPicked && ggPicked.type === "saved" ? ggPicked.id : null;
    places.forEach(function (p) {
      dot(p, p.id === sel, false).on("click", function () {
        ggPicked = { type: "saved", id: p.id };
        refreshPicked();
      });
    });
    if (ggPicked && ggPicked.type === "custom") {
      dot(pickedPlace(), true, true).on("click", function () { /* 같은 곳을 다시 눌러도 그대로 */ });
    }
  }

  function renderPicked() {
    var box = document.getElementById("gg-picked");
    box.textContent = "";
    box.hidden = !ggCtx || !map;
    if (box.hidden) return;
    box.appendChild(el("h3", "", "고른 곳 판정"));
    var p = pickedPlace();
    if (!p) {
      box.appendChild(el("p", "empty", "지도의 빈 곳이나 저장한 곳 점을 누르면 여기에 판정이 나옵니다."));
      return;
    }
    var r = judge(ggCtx.g, ggCtx.startMin, p, ggCtx.elevatorMin, routeOf);
    var ul = el("ul", "place-list");
    var extra = ggPicked.type === "custom"
      ? "위치 " + p.lat.toFixed(5) + ", " + p.lng.toFixed(5) + " · 머물 시간은 입력값(" + ggStay + "분)을 씁니다"
      : "";
    ul.appendChild(buildRow(p, r, extra));
    box.appendChild(ul);
  }

  function refreshPicked() {
    if (!map) return;
    var pk = pickedPlace();
    if (pk && ggCtx) {   // 고른 곳의 길은 대기열 맨 앞으로
      requestRoute(ggCtx.g.prev.building, pk, true);
      if (ggCtx.g.next.building !== ggCtx.g.prev.building) requestRoute(ggCtx.g.next.building, pk, true);
    }
    drawOverlay();
    renderPicked();
  }

  var stayInput = document.getElementById("gg-stay-input");
  var stayMsg = document.getElementById("gg-stay-msg");
  stayInput.addEventListener("input", function () {
    var v = stayInput.value.trim() === "" ? NaN : Number(stayInput.value);
    if (Number.isInteger(v) && v >= STAY_MIN && v <= STAY_MAX) {
      ggStay = v;
      stayMsg.textContent = "";
      refreshPicked();
    } else {
      stayMsg.textContent = "머물 시간은 " + STAY_MIN + "~" + STAY_MAX + "분 정수로 입력하세요 (지금은 " + ggStay + "분 적용 중)";
    }
  });
  stayInput.addEventListener("change", function () {
    var v = stayInput.value.trim() === "" ? NaN : Number(stayInput.value);
    if (!(Number.isInteger(v) && v >= STAY_MIN && v <= STAY_MAX)) stayInput.value = ggStay;
  });

  function classLabel(c) {
    return c.name + " (" + c.building + " " + c.room + "호, " + floorOf(c.room) + "층)";
  }

  function renderGonggang() {
    var warn = document.getElementById("gg-warn");
    warn.textContent = placesWarning;
    warn.hidden = placesWarning === "";

    var today = todayIndex() >= 0 ? DAYS[todayIndex()] : null;

    var daysEl = document.getElementById("gg-days");
    daysEl.textContent = "";
    DAYS.forEach(function (d) {
      var b = el("button", "day-btn", d + (d === today ? " (오늘)" : ""));
      b.type = "button";
      b.setAttribute("aria-pressed", d === ggDay ? "true" : "false");
      b.addEventListener("click", function () { ggDay = d; ggGap = 0; renderGonggang(); });
      daysEl.appendChild(b);
    });

    var gaps = findGaps(timetable, ggDay);
    if (ggGap >= gaps.length) ggGap = 0;
    var now = nowMinutes();
    function isNow(g) { return ggDay === today && now >= g.start && now < g.end; }

    var cardsEl = document.getElementById("gg-cards");
    var resultEl = document.getElementById("gg-result");
    var elevEl = document.getElementById("gg-elev");
    cardsEl.textContent = "";
    resultEl.textContent = "";
    elevEl.textContent = "";

    var stayEl = document.getElementById("gg-stay");
    var mapWrap = document.getElementById("gg-map-wrap");
    var mapEl = document.getElementById("gg-map");
    var legendEl = document.getElementById("gg-legend");
    var pickedEl = document.getElementById("gg-picked");

    if (gaps.length === 0) {
      ggCtx = null;
      stayEl.hidden = true;
      mapWrap.hidden = true;
      pickedEl.hidden = true;
      cardsEl.appendChild(el("p", "empty", ggDay + "요일은 공강이 없습니다."));
      return;
    }

    gaps.forEach(function (g, i) {
      var card = el("button", "card");
      card.type = "button";
      card.setAttribute("aria-pressed", i === ggGap ? "true" : "false");
      card.appendChild(el("div", "when", fmt(g.start) + "–" + fmt(g.end) + " · 공강 " + (g.end - g.start) + "분"));
      card.appendChild(el("div", "sub", "앞 수업: " + classLabel(g.prev)));
      card.appendChild(el("div", "sub", "다음 수업: " + classLabel(g.next)));
      if (isNow(g)) card.appendChild(el("div", "now", "지금 공강 중 · 현재 시각부터 계산"));
      card.addEventListener("click", function () { ggGap = i; renderGonggang(); });
      cardsEl.appendChild(card);
    });

    elevEl.appendChild(el("span", "elev-label", "엘리베이터:"));
    [[false, "붐빔 " + ELEVATOR_BUSY_MIN + "분"], [true, "한산 " + ELEVATOR_QUIET_MIN + "분"]].forEach(function (opt) {
      var b = el("button", "day-btn", opt[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", ggQuiet === opt[0] ? "true" : "false");
      b.addEventListener("click", function () { ggQuiet = opt[0]; renderGonggang(); });
      elevEl.appendChild(b);
    });
    var elevatorMin = ggQuiet ? ELEVATOR_QUIET_MIN : ELEVATOR_BUSY_MIN;

    var g = gaps[ggGap];
    var startMin = isNow(g) ? now : g.start;

    // 길 찾기 요청(이미 받았거나 요청 중인 쌍은 건너뜀). 판정은 먼저 직선 추정으로 보여주고 결과가 오면 다시 그림
    var routePairs = [];
    places.forEach(function (p) {
      routePairs.push({ building: g.prev.building, place: p });
      if (g.next.building !== g.prev.building) routePairs.push({ building: g.next.building, place: p });
    });
    routePairs.forEach(function (pr) { requestRoute(pr.building, pr.place, false); });
    var prog = routeProgress(routePairs);

    resultEl.appendChild(el("p", "summary",
      "계산 시작 " + fmt(startMin) + (isNow(g) ? " (현재 시각)" : " (공강 시작)") +
      " · 남은 공강 " + (g.end - startMin) + "분 · 다음 수업 " + fmt(g.end)));
    resultEl.appendChild(el("p", "note",
      "도보 거리는 길 찾기 결과를 쓰고, 길 찾기가 안 되면 직선거리 × 1.3으로 추정합니다. 엘리베이터는 " +
      (ggQuiet ? "한산(" + ELEVATOR_QUIET_MIN : "붐빔(" + ELEVATOR_BUSY_MIN) + "분) 기준입니다. 머물 수 있는 시간이 긴 순으로 정렬했습니다."));
    resultEl.appendChild(el("p", "note",
      prog.done < prog.total ? "길 찾는 중 (" + prog.done + "/" + prog.total + ") — 그동안은 직선 추정으로 보여줍니다."
      : prog.failed > 0 ? "일부(" + prog.failed + "건)는 길 찾기에 실패해 직선 추정을 씁니다."
      : "길 찾기 완료"));

    var rows = places.map(function (p) { return { p: p, r: judge(g, startMin, p, elevatorMin, routeOf) }; })
      .sort(function (a, b) { return b.r.stay - a.r.stay; });

    var ul = el("ul", "place-list");
    rows.forEach(function (row) { ul.appendChild(buildRow(row.p, row.r)); });
    resultEl.appendChild(ul);

    // 지도 영역: Leaflet을 못 불러오면 지도·머물 시간 입력칸·고른 곳 판정만 숨기고 위 목록은 그대로 둠
    ggCtx = { g: g, startMin: startMin, elevatorMin: elevatorMin };
    mapWrap.hidden = false;
    mapEl.hidden = false;
    var mapOk = ensureMap();
    stayEl.hidden = !mapOk;
    mapEl.hidden = !mapOk;
    legendEl.hidden = !mapOk;
    if (mapOk) {
      map.invalidateSize({ pan: false });
      refreshPicked();
    } else {
      document.getElementById("gg-map-note").textContent =
        "지도를 불러오지 못했습니다. 판정 목록은 그대로 쓸 수 있습니다.";
      pickedEl.hidden = true;
    }
  }

  // 길 찾기 결과가 올 때마다 공강 화면을 다시 그림 (연속으로 와도 한 번에 모아서)
  var routeRenderQueued = false;
  routeListener = function () {
    if (routeRenderQueued) return;
    routeRenderQueued = true;
    setTimeout(function () { routeRenderQueued = false; renderGonggang(); }, 0);
  };

  // ---------- 추가·삭제 ----------
  var msgEl = document.getElementById("form-msg");
  function setMsg(text, isError) {
    msgEl.textContent = text;
    msgEl.className = "msg" + (isError ? " error" : "");
  }

  function removeClass(id) {
    timetable = timetable.filter(function (c) { return c.id !== id; });
    var ok = save();
    renderTable();
    setMsg(ok ? "삭제했습니다." : "삭제했지만 저장에는 실패했습니다.", !ok);
  }

  var buildingSel = document.getElementById("f-building");
  BUILDINGS.forEach(function (b) {
    var o = document.createElement("option");
    o.textContent = b;
    buildingSel.appendChild(o);
  });

  function fillTimeSelect(sel, placeholder, from, to, step) {
    var first = document.createElement("option");
    first.value = "";
    first.textContent = placeholder;
    sel.appendChild(first);
    for (var n = from; n <= to; n += step) {
      var o = document.createElement("option");
      o.value = pad(n);
      o.textContent = pad(n);
      sel.appendChild(o);
    }
  }
  ["start", "end"].forEach(function (k) {
    fillTimeSelect(document.getElementById("f-" + k + "-h"), "시", 7, 22, 1);
    fillTimeSelect(document.getElementById("f-" + k + "-m"), "분", 0, 55, 5);
  });

  function readTime(k) {
    var h = document.getElementById("f-" + k + "-h").value;
    var m = document.getElementById("f-" + k + "-m").value;
    return h && m ? h + ":" + m : "";
  }

  document.getElementById("add-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var day = document.getElementById("f-day").value;
    var name = document.getElementById("f-name").value.trim();
    var building = buildingSel.value;
    var room = document.getElementById("f-room").value.trim();
    var start = readTime("start");
    var end = readTime("end");

    if (!name) return setMsg("과목 이름을 입력하세요.", true);
    if (!/^[1-9]\d\d$/.test(room)) return setMsg("호실은 3자리 숫자로 입력하세요. 첫 자리가 층입니다. (예: 707)", true);
    if (!start || !end) return setMsg("시작과 끝 시간을 입력하세요.", true);
    if (toMin(end) <= toMin(start)) return setMsg("끝 시간은 시작 시간보다 늦어야 합니다.", true);

    var s = toMin(start), e = toMin(end);
    var clash = timetable.filter(function (c) {
      return c.day === day && s < toMin(c.end) && e > toMin(c.start);
    });
    if (clash.length) {
      var list = clash.map(function (c) {
        return "'" + c.name + "' (" + c.start + "–" + c.end + ")";
      }).join(", ");
      return setMsg(day + "요일 " + list + " 수업과 시간이 겹쳐 추가할 수 없습니다.", true);
    }

    timetable.push({
      id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      day: day, name: name, building: building, room: room, start: start, end: end
    });
    var ok = save();
    renderTable();
    document.getElementById("f-name").value = "";
    document.getElementById("f-room").value = "";
    setMsg(ok ? "추가했습니다." : "추가했지만 저장에는 실패했습니다.", !ok);
  });

  renderTable();
})();
</script>
</body>
</html>
